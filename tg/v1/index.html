<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>WBExchangeSDK Integration</title>
    <style>
        :root {
            --tg-height: 100vh;
            --tg-stable-height: 100vh;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #fff;
        }

        #wrapper {
          height: 100vh;
          overflow: hidden; /* не скроллится */
          background: #fff;
          display: flex;
          flex-direction: column;
        }

        #wbExchangeSdkWrapper {
            flex: 1;
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="wbExchangeSdkWrapper"></div>

        <script src="https://sdk.dev.wbdevel.net/v2.0/integration/wbExchangeSdk-v001.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const email = localStorage.getItem("email") || "";
                const sdkConfig = {
                    el: document.getElementById("wbExchangeSdkWrapper"),
                    merchantId: '4f19017b-0793-4591-94ff-610bb3c4665b',
                    mode: wbExchangeSdk.mode.LoginMode,

                    email: email,
                    merchantPass: 'NGYxOTAxN2ItMDc5My00NTkxLTk0ZmYtNjEwYmIzYzQ2NjViOktMSkhmZCxrbEhJIVhsaw==',

                    showBackButtonOnHomePage: false,
                    disableAddCard: false,

                    onExit: () => {},
                    onUserData: ({ email }) => {
                        localStorage.setItem("email", email);
                    }
                };

                if (window.Telegram && window.Telegram.WebApp) {
                    const telegramUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
                    console.log("Telegram WebApp API запущен");

                    if (telegramUserId) {
                        sdkConfig.externalUserId = telegramUserId;
                    }

                    window.Telegram.WebApp.expand();
                    window.Telegram.WebApp.setBackgroundColor('#ffffff');
                } else {
                    console.log("Telegram WebApp API не найден");
                }

                wbExchangeSdk.setup(sdkConfig);
            });

        </script>
    </div>
</body>
</html>
