<html lang="ru" style="--tg-viewport-height: 100vh; --tg-viewport-stable-height: 100vh;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>WBExchangeSDK Integration</title>
  <style>
    :root {
      --tg-height: 100vh;
      --tg-stable-height: 100vh;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    #wrapper {
      height: 100vh;
      overflow: hidden; /* не скроллится */
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    #wbExchangeSdkWrapper {
      flex: 1;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
<div id="wrapper">
  <div id="wbExchangeSdkWrapper"></div>
  <script src="https://sdk.whitebird.io/v2.0/integration/wbExchangeSdk-v001.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const email = localStorage.getItem("email") || "";
      const sdkConfig = {
        el: document.getElementById("wbExchangeSdkWrapper"),
        merchantId: '11111111-1111-1111-1111-111111111111',
        mode: wbExchangeSdk.mode.LoginMode,

        email: email,
        merchantPass: 'MTExMTExMTEtMTExMS0xMTExLTExMTEtMTExMTExMTExMTExOnlhPEBZaTJ5OTYtJA==',

        showBackButtonOnHomePage: false,
        disableAddCard: false,

        onExit: () => {},
        onUserData: ({ email, accessToken, refreshToken }) => {
          localStorage.setItem("email", email);
          localStorage.setItem("accessToken", accessToken);
          localStorage.setItem("refreshToken", refreshToken);
        }
      };

      if (window.Telegram && window.Telegram.WebApp) {
        const telegramUserId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
        console.log("Telegram WebApp API запущен");

        if (telegramUserId) {
          sdkConfig.externalUserId = telegramUserId;
        }

        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.setBackgroundColor('#ffffff');
      } else {
        console.log("Telegram WebApp API не найден");
      }

      wbExchangeSdk.setup(sdkConfig);
    });

  </script>
</div>

</body></html>
